<!DOCTYPE html>

    .oddball-row {
      display: flex;
      flex-direction: row;
      gap: 20px;
      justify-content: center;
      align-items: center;
    }
    .oddball-cell {
      cursor: pointer;
      border: 4px solid transparent;
      border-radius: 6px;
      transition: border-color 0.15s;
    }
    .oddball-cell:hover {
      border-color: #666;
    }
    .oddball-cell img {
      width: 200px;
      height: 200px;
      display: block;
    }
    .oddball-cell.cell-correct {
      border-color: #2e7d32 !important;
    }
    .oddball-cell.cell-incorrect {
      border-color: #c62828 !important;
    }
    .trial-prompt {
      text-align: center;
      font-size: 18px;
      margin-bottom: 15px;
    }
    .trial-counter {
      text-align: center;
      font-size: 14px;
      color: #888;
      margin-bottom: 8px;
    }
    .feedback-banner {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin-top: 20px;
    }
    .feedback-banner.correct {
      color: #2e7d32;
    }
    .feedback-banner.incorrect {
      color: #c62828;
    }
    .rating-area {
      display: none;
      text-align: center;
      margin-top: 16px;
    }
    .rating-area p {
      font-size: 16px;
      margin-bottom: 8px;
    }
    .rating-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .rating-buttons button {
      padding: 8px 18px;
      font-size: 15px;
      cursor: pointer;
      border: 1px solid #aaa;
      border-radius: 4px;
      background: #fff;
      transition: background 0.1s;
    }
    .rating-buttons button:hover {
      background: #e0e0e0;
    }
    .mask-canvas {
      display: block;
      margin: 0 auto;
    }
  </style>
</head>

// ── Build image paths ──────────────────────────────────────────────────────
function trialImages(t) {
  const tid = String(t.id).padStart(2, '0');
  const oddball = `${STIM_DIR}t${tid}_part1_oddball_${t.version}.png`;
  const distractors = [2, 3, 4].map(p =>
    `${STIM_DIR}t${tid}_part${p}_distractor_${t.version}.png`
  );
  return { oddball, distractors };
}

// ── Preload ────────────────────────────────────────────────────────────────
const all_images = [];
trial_list.forEach(t => {
  const imgs = trialImages(t);
  all_images.push(imgs.oddball, ...imgs.distractors);
});

// ── Pattern mask helper ────────────────────────────────────────────────────
// Generates a random-noise canvas as a data URL (used as an inter-trial mask)
function makeMaskHTML(w, h, blockSize) {
  return `<canvas class="mask-canvas" id="mask-canvas" width="${w}" height="${h}"></canvas>`;
}
function drawMask(canvasId, blockSize) {
  const c = document.getElementById(canvasId);
  if (!c) return;
  const ctx = c.getContext('2d');
  for (let y = 0; y < c.height; y += blockSize) {
    for (let x = 0; x < c.width; x += blockSize) {
      const r = Math.floor(Math.random() * 256);
      const g = Math.floor(Math.random() * 256);
      const b = Math.floor(Math.random() * 256);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.fillRect(x, y, blockSize, blockSize);
    }
  }
}

// ── Shuffle helper ─────────────────────────────────────────────────────────
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ── Build timeline ─────────────────────────────────────────────────────────
const timeline = [];
const total_trials = trial_list.length;

timeline.push({
  type: jsPsychPreload,
  images: all_images,
  show_progress_bar: true,
  message: '<p>Loading stimuli...</p>'
});

timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <div style="max-width: 600px; margin: 0 auto; text-align: left;">
      <h2>Color Oddball Task</h2>
      <p>On each trial you will see <strong>four color pattern images</strong>
      in a row.</p>
      <p><strong>Three</strong> of the images have the same color distribution.
      <strong>One</strong> image (the "oddball") has a slightly different
      color distribution.</p>
      <p>Your task: <strong>click the image that looks different</strong>
      from the other three.</p>
      <p>After each response you will see feedback (correct/incorrect) and
      then rate how difficult the trial was. There are
      <strong>${total_trials} trials</strong>.</p>
    </div>
  `,
  choices: ['Begin']
});

const shuffled_trials = shuffle([...trial_list]);

shuffled_trials.forEach((t, trial_index) => {
  const trial_number = trial_index + 1;
  const imgs = trialImages(t);
  const items = [
    { src: imgs.oddball, is_oddball: true, part: 1 },
    { src: imgs.distractors[0], is_oddball: false, part: 2 },
    { src: imgs.distractors[1], is_oddball: false, part: 3 },
    { src: imgs.distractors[2], is_oddball: false, part: 4 },
  ];
  shuffle(items);
  const oddball_position = items.findIndex(x => x.is_oddball);

  // ── Pattern mask (500ms) ───────────────────────────────────────────────
  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: makeMaskHTML(880, 200, 10),
    choices: 'NO_KEYS',
    trial_duration: 500,
    on_load: function() { drawMask('mask-canvas', 10); }
  });

  // ── Oddball trial with feedback + difficulty rating ────────────────────
  const row_html = `
    <p class="trial-counter">Trial ${trial_number} of ${total_trials}</p>
    <p class="trial-prompt">Click the image that looks different.</p>
    <div class="oddball-row">
      ${items.map((item, i) => `
        <div class="oddball-cell" id="cell-${i}" data-pos="${i}"
             onclick="document.dispatchEvent(new CustomEvent('oddball-click',{detail:{position:${i}}}))">
          <img src="${item.src}" alt="stimulus">
        </div>
      `).join('')}
    </div>
    <div class="feedback-banner" id="feedback-banner"></div>
    <div class="rating-area" id="rating-area">
      <p>How difficult was this trial?</p>
      <div class="rating-buttons">
        <button data-rating="1">1<br><small>Very easy</small></button>
        <button data-rating="2">2<br><small>Easy</small></button>
        <button data-rating="3">3<br><small>Moderate</small></button>
        <button data-rating="4">4<br><small>Hard</small></button>
        <button data-rating="5">5<br><small>Very hard</small></button>
      </div>
    </div>
  `;

  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: row_html,
    choices: 'NO_KEYS',
    trial_duration: null,
    data: {
      task: 'oddball',
      trial_id: t.id,
      trial_number: trial_number,
      category: t.cat,
      image_id: t.img,
      difficulty: t.diff,
      n_colors: t.k,
      oddball_position: oddball_position,
      version: t.version
    },
    on_load: function() {
      const start_time = performance.now();

      const handler = function(e) {
        const pos = e.detail.position;
        const correct = pos === oddball_position;
        const click_rt = performance.now() - start_time;

        document.removeEventListener('oddball-click', handler);

        // Disable further clicks
        for (let c = 0; c < 4; c++) {
          const el = document.getElementById('cell-' + c);
          el.style.pointerEvents = 'none';
          el.style.cursor = 'default';
        }

        // Green on correct cell
        document.getElementById('cell-' + oddball_position).classList.add('cell-correct');

        // Red on chosen cell if wrong
        if (!correct) {
          document.getElementById('cell-' + pos).classList.add('cell-incorrect');
        }

        // Feedback banner
        const banner = document.getElementById('feedback-banner');
        banner.classList.add(correct ? 'correct' : 'incorrect');
        banner.textContent = correct ? 'Correct!' : 'Incorrect';

        // Show difficulty rating
        document.getElementById('rating-area').style.display = 'block';

        // Listen for rating click
        document.querySelectorAll('.rating-buttons button').forEach(btn => {
          btn.addEventListener('click', function() {
            const rating = parseInt(this.getAttribute('data-rating'));
            jsPsych.finishTrial({
              response_position: pos,
              correct: correct,
              rt: click_rt,
              difficulty_rating: rating
            });
          });
        });
      };

      document.addEventListener('oddball-click', handler);
    }
  });
});

// End screen
timeline.push({
