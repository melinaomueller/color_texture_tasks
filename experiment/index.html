<html>

  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-image-keyboard-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css">
  <style>
    .oddball-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 20px;
      max-width: 500px;
      margin: 0 auto;
    }
    .oddball-cell {
      cursor: pointer;
      border: 4px solid transparent;
      transition: border-color 0.15s;
    }
    .oddball-cell:hover {
      border-color: #666;
    }
    .oddball-cell img {
      width: 200px;
      height: 200px;
      display: block;
    }
    .trial-prompt {
      text-align: center;
      font-size: 18px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body></body>

  on_finish: function() {

];

// ── Build image paths and preload list ─────────────────────────────────────
const version = 'original';  // Change to 'lum_eq' or 'chroma_boost_lum_eq' as needed
const all_images = [];

function trialImages(t) {
  const tid = String(t.id).padStart(2, '0');
  const oddball = `${STIM_DIR}t${tid}_part1_oddball_${version}.png`;
  const distractors = [2, 3, 4].map(p =>
    `${STIM_DIR}t${tid}_part${p}_distractor_${version}.png`
  );
  return { oddball, distractors };
}

trial_list.forEach(t => {
  const imgs = trialImages(t);
  all_images.push(imgs.oddball, ...imgs.distractors);
});

// ── Shuffle helper ─────────────────────────────────────────────────────────
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ── Build timeline ─────────────────────────────────────────────────────────
const timeline = [];

// Preload
timeline.push({
  type: jsPsychPreload,
  images: all_images,
  show_progress_bar: true,
  message: '<p>Loading stimuli...</p>'
});

// Instructions
timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `
    <div style="max-width: 600px; margin: 0 auto; text-align: left;">
      <h2>Color Oddball Task</h2>
      <p>On each trial you will see <strong>four color pattern images</strong>
      arranged in a 2&times;2 grid.</p>
      <p><strong>Three</strong> of the images have the same color distribution.
      <strong>One</strong> image (the "oddball") has a slightly different
      color distribution.</p>
      <p>Your task: <strong>click the image that looks different</strong>
      from the other three.</p>
      <p>Press any key to begin.</p>
    </div>
  `,
  choices: 'ALL_KEYS'
});

// Fixation + trial for each
const shuffled_trials = shuffle([...trial_list]);

shuffled_trials.forEach(t => {
  // Fixation cross
  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '<div style="font-size:60px;">+</div>',
    choices: 'NO_KEYS',
    trial_duration: 500
  });

  // Build the 4 images with position randomization
  const imgs = trialImages(t);
  const items = [
    { src: imgs.oddball, is_oddball: true, part: 1 },
    { src: imgs.distractors[0], is_oddball: false, part: 2 },
    { src: imgs.distractors[1], is_oddball: false, part: 3 },
    { src: imgs.distractors[2], is_oddball: false, part: 4 },
  ];
  shuffle(items);

  const oddball_position = items.findIndex(x => x.is_oddball);

  const grid_html = `
    <p class="trial-prompt">Click the image that looks different.</p>
    <div class="oddball-grid">
      ${items.map((item, i) => `
        <div class="oddball-cell" data-pos="${i}" data-oddball="${item.is_oddball}"
             onclick="document.dispatchEvent(new CustomEvent('oddball-click',{detail:{position:${i}}}))">
          <img src="${item.src}" alt="stimulus">
        </div>
      `).join('')}
    </div>
  `;

  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: grid_html,
    choices: 'NO_KEYS',
    trial_duration: null, // wait for click
    data: {
      task: 'oddball',
      trial_id: t.id,
      category: t.cat,
      image_id: t.img,
      difficulty: t.diff,
      n_colors: t.k,
      oddball_position: oddball_position,
      version: version
    },
    on_load: function() {
      const handler = function(e) {
        const pos = e.detail.position;
        const correct = pos === oddball_position;
        jsPsych.finishTrial({
          response_position: pos,
          correct: correct,
          rt: performance.now() - jsPsych.getCurrentTrial().start_time
        });
        document.removeEventListener('oddball-click', handler);
      };
      jsPsych.getCurrentTrial().start_time = performance.now();
      document.addEventListener('oddball-click', handler);
    }
  });
});

// End screen
timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `
    <div style="text-align:center;">
      <h2>Task Complete</h2>
      <p>Thank you! Your data has been saved.</p>
      <p>Press any key to finish.</p>
    </div>
  `,
  choices: 'ALL_KEYS'
});

jsPsych.run(timeline);
</script>
</html>
