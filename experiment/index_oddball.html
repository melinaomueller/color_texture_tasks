<!DOCTYPE html>
<html>
<head>
  <title>Color Oddball Task</title>
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css">
  <style>
    body, .jspsych-content, .jspsych-display-element {
      background-color: #F0F0F0 !important;
    }
    img {
      -webkit-user-drag: none;
      user-select: none;
      pointer-events: auto;
    }
    /* Fixed-height trial container to prevent layout shift */
    .trial-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 340px;
    }
    .oddball-row {
      display: flex;
      flex-direction: row;
      gap: 20px;
      justify-content: center;
      align-items: center;
    }
    .oddball-cell {
      cursor: pointer;
      border: 4px solid transparent;
      border-radius: 6px;
      transition: border-color 0.15s;
    }
    .oddball-cell:hover {
      border-color: #999;
    }
    .oddball-cell img {
      width: 200px;
      height: 200px;
      display: block;
    }
    .oddball-cell.cell-correct {
      border-color: #1b5e20 !important;
    }
    .oddball-cell.cell-incorrect {
      border-color: #b71c1c !important;
    }
    .trial-prompt {
      text-align: center;
      font-size: 18px;
      margin-bottom: 15px;
      color: #222;
    }
    .trial-counter {
      text-align: center;
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }
    .feedback-banner {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin-top: 20px;
      min-height: 40px;
    }
    .feedback-banner.correct {
      color: #1b5e20;
    }
    .feedback-banner.incorrect {
      color: #b71c1c;
    }
    .mask-canvas {
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;"></body>
<script>
const jsPsych = initJsPsych({
  on_finish: function() {
    jsPsych.data.get().filter({task: 'oddball'}).localSave('csv', 'oddball_data.csv');
  }
});

// ── Trial definitions (54 trials — oddball split) ──
const STIM_DIR = '../bitmap_trials/jspsych_stimuli/';

const ATTENTION_CHECK_IDS = [
  {id: 86, version: 'lum_eq'},
];

const trial_list = [
  {id:3, cat:"fleece", img:"1064", diff:0.30, k:5, version:"original"},
  {id:5, cat:"emerald", img:"0938", diff:0.30, k:4, version:"chroma_boost_lum_eq"},
  {id:7, cat:"silk", img:"2764", diff:0.30, k:4, version:"chroma_boost_lum_eq"},
  {id:7, cat:"silk", img:"2764", diff:0.30, k:4, version:"original"},
  {id:9, cat:"plastic", img:"2241", diff:0.30, k:3, version:"chroma_boost_lum_eq"},
  {id:10, cat:"chiffon", img:"0580", diff:0.30, k:3, version:"original"},
  {id:12, cat:"ember", img:"0916", diff:0.30, k:3, version:"original"},
  {id:13, cat:"quartzite", img:"2383", diff:0.25, k:5, version:"original"},
  {id:18, cat:"brownstone", img:"0330", diff:0.25, k:4, version:"chroma_boost_lum_eq"},
  {id:20, cat:"oilpaper", img:"1955", diff:0.25, k:4, version:"chroma_boost_lum_eq"},
  {id:21, cat:"sapphire", img:"2631", diff:0.25, k:3, version:"lum_eq"},
  {id:22, cat:"gelatin", img:"1275", diff:0.25, k:3, version:"chroma_boost_lum_eq"},
  {id:23, cat:"resin", img:"2433", diff:0.25, k:3, version:"original"},
  {id:24, cat:"bone", img:"0228", diff:0.25, k:3, version:"original"},
  {id:25, cat:"satin", img:"2653", diff:0.20, k:5, version:"lum_eq"},
  {id:25, cat:"satin", img:"2653", diff:0.20, k:5, version:"original"},
  {id:36, cat:"frankincense", img:"1176", diff:0.20, k:3, version:"original"},
  {id:39, cat:"play_dough", img:"2284", diff:0.15, k:5, version:"chroma_boost_lum_eq"},
  {id:40, cat:"crepe_paper", img:"0837", diff:0.20, k:5, version:"chroma_boost_lum_eq"},
  {id:40, cat:"crepe_paper", img:"0837", diff:0.20, k:5, version:"original"},
  {id:41, cat:"foliage", img:"1156", diff:0.15, k:4, version:"original"},
  {id:42, cat:"rhinestone", img:"2450", diff:0.15, k:4, version:"chroma_boost_lum_eq"},
  {id:42, cat:"rhinestone", img:"2450", diff:0.15, k:4, version:"lum_eq"},
  {id:45, cat:"sequin", img:"2693", diff:0.15, k:3, version:"chroma_boost_lum_eq"},
  {id:46, cat:"flame", img:"1025", diff:0.15, k:3, version:"chroma_boost_lum_eq"},
  {id:47, cat:"moonstone", img:"1802", diff:0.15, k:3, version:"chroma_boost_lum_eq"},
  {id:47, cat:"moonstone", img:"1802", diff:0.15, k:3, version:"original"},
  {id:50, cat:"sponge", img:"2924", diff:0.15, k:5, version:"original"},
  {id:51, cat:"marble", img:"1756", diff:0.15, k:5, version:"original"},
  {id:52, cat:"suede", img:"2973", diff:0.15, k:5, version:"original"},
  {id:54, cat:"fluorine", img:"1108", diff:0.15, k:4, version:"chroma_boost_lum_eq"},
  {id:56, cat:"egg_shell", img:"0904", diff:0.15, k:4, version:"chroma_boost_lum_eq"},
  {id:56, cat:"egg_shell", img:"0904", diff:0.15, k:4, version:"original"},
  {id:57, cat:"ruby", img:"2514", diff:0.15, k:3, version:"chroma_boost_lum_eq"},
  {id:57, cat:"ruby", img:"2514", diff:0.15, k:3, version:"lum_eq"},
  {id:62, cat:"paint", img:"2037", diff:0.25, k:4, version:"original"},
  {id:64, cat:"paint", img:"2030", diff:0.15, k:5, version:"chroma_boost_lum_eq"},
  {id:64, cat:"paint", img:"2030", diff:0.15, k:5, version:"original"},
  {id:68, cat:"paint", img:"2042", diff:0.20, k:4, version:"lum_eq"},
  {id:69, cat:"play_dough", img:"2270", diff:0.30, k:5, version:"chroma_boost_lum_eq"},
  {id:69, cat:"play_dough", img:"2270", diff:0.30, k:5, version:"original"},
  {id:70, cat:"play_dough", img:"2271", diff:0.25, k:4, version:"original"},
  {id:73, cat:"play_dough", img:"2277", diff:0.15, k:4, version:"chroma_boost_lum_eq"},
  {id:73, cat:"play_dough", img:"2277", diff:0.15, k:4, version:"original"},
  {id:74, cat:"play_dough", img:"2279", diff:0.30, k:3, version:"chroma_boost_lum_eq"},
  {id:76, cat:"play_dough", img:"2283", diff:0.20, k:4, version:"chroma_boost_lum_eq"},
  {id:76, cat:"play_dough", img:"2283", diff:0.20, k:4, version:"original"},
  {id:77, cat:"play_dough", img:"2273", diff:0.20, k:3, version:"chroma_boost_lum_eq"},
  {id:77, cat:"play_dough", img:"2273", diff:0.20, k:3, version:"original"},
  {id:82, cat:"crepe_paper", img:"0841", diff:0.20, k:4, version:"chroma_boost_lum_eq"},
  {id:82, cat:"crepe_paper", img:"0841", diff:0.20, k:4, version:"original"},
  {id:83, cat:"crepe_paper", img:"0838", diff:0.25, k:5, version:"original"},
  {id:86, cat:"microfiber", img:"1783", diff:0.15, k:3, version:"lum_eq"},      // attention check
  {id:86, cat:"microfiber", img:"1783", diff:0.15, k:3, version:"original"},
];

// ── Build image paths ──────────────────────────────────────────────────────
function trialImages(t) {
  const tid = String(t.id).padStart(2, '0');
  const oddball = `${STIM_DIR}t${tid}_part1_oddball_${t.version}.png`;
  const distractors = [2, 3, 4].map(p =>
    `${STIM_DIR}t${tid}_part${p}_distractor_${t.version}.png`
  );
  return { oddball, distractors };
}

function isAttentionCheck(t) {
  return ATTENTION_CHECK_IDS.some(ac => ac.id === t.id && ac.version === t.version);
}

// ── Preload ────────────────────────────────────────────────────────────────
const all_images = [];
trial_list.forEach(t => {
  const imgs = trialImages(t);
  all_images.push(imgs.oddball, ...imgs.distractors);
});

// ── Pattern mask helper ────────────────────────────────────────────────────
// Grayscale mask matching the 4AFC layout (4 × 200x200 squares with 20px gaps)
function makeMaskHTML_4() {
  return `<div class="trial-container">
    <p class="trial-counter" style="visibility:hidden;">placeholder</p>
    <p class="trial-prompt" style="visibility:hidden;">placeholder</p>
    <div class="oddball-row">${
    [0,1,2,3].map(i =>
      `<div class="oddball-cell" style="cursor:default;">` +
      `<canvas class="mask-canvas" id="mask-${i}" width="200" height="200"></canvas></div>`
    ).join('')
    }</div>
    <div class="feedback-banner"></div>
  </div>`;
}
function drawMask(canvasId, blockSize) {
  const c = document.getElementById(canvasId);
  if (!c) return;
  const ctx = c.getContext('2d');
  for (let y = 0; y < c.height; y += blockSize) {
    for (let x = 0; x < c.width; x += blockSize) {
      const v = Math.floor(Math.random() * 256);
      ctx.fillStyle = `rgb(${v},${v},${v})`;
      ctx.fillRect(x, y, blockSize, blockSize);
    }
  }
}
function drawAllMasks(n, blockSize) {
  for (let i = 0; i < n; i++) drawMask('mask-' + i, blockSize);
}

// ── Shuffle helper ─────────────────────────────────────────────────────────
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ── Build timeline ─────────────────────────────────────────────────────────
const timeline = [];
const total_trials = trial_list.length;

timeline.push({
  type: jsPsychPreload,
  images: all_images,
  show_progress_bar: true,
  message: '<p>Loading stimuli...</p>'
});

timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <div style="max-width: 600px; margin: 0 auto; text-align: left;">
      <h2>Color Oddball Task</h2>
      <p>On each trial you will see <strong>four color pattern images</strong>
      in a row.</p>
      <p><strong>Three</strong> of the images have the same color distribution.
      <strong>One</strong> image (the "oddball") has a slightly different
      color distribution.</p>
      <p>Your task: <strong>click the image that looks different</strong>
      from the other three.</p>
      <p>After each response you will see feedback (correct/incorrect).
      There are <strong>${total_trials} trials</strong>.</p>
    </div>
  `,
  choices: ['Begin']
});

const shuffled_trials = shuffle([...trial_list]);

shuffled_trials.forEach((t, trial_index) => {
  const trial_number = trial_index + 1;
  const imgs = trialImages(t);
  const items = [
    { src: imgs.oddball, is_oddball: true, part: 1 },
    { src: imgs.distractors[0], is_oddball: false, part: 2 },
    { src: imgs.distractors[1], is_oddball: false, part: 3 },
    { src: imgs.distractors[2], is_oddball: false, part: 4 },
  ];
  shuffle(items);
  const oddball_position = items.findIndex(x => x.is_oddball);

  // ── Pattern mask (500ms) ───────────────────────────────────────────────
  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: makeMaskHTML_4(),
    choices: 'NO_KEYS',
    trial_duration: 500,
    on_load: function() { drawAllMasks(4, 10); }
  });

  // ── Oddball trial with in-place feedback, auto-advance ─────────────────
  const row_html = `
    <p class="trial-counter">Trial ${trial_number} of ${total_trials}</p>
    <p class="trial-prompt">Click the image that looks different.</p>
    <div class="oddball-row">
      ${items.map((item, i) => `
        <div class="oddball-cell" id="cell-${i}" data-pos="${i}"
             onclick="document.dispatchEvent(new CustomEvent('oddball-click',{detail:{position:${i}}}))">
          <img src="${item.src}" alt="stimulus">
        </div>
      `).join('')}
    </div>
    <div class="feedback-banner" id="feedback-banner"></div>
  `;

  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: row_html,
    choices: 'NO_KEYS',
    trial_duration: null,
    data: {
      task: 'oddball',
      trial_id: t.id,
      trial_number: trial_number,
      category: t.cat,
      image_id: t.img,
      difficulty: t.diff,
      n_colors: t.k,
      oddball_position: oddball_position,
      version: t.version,
      attention_check: isAttentionCheck(t)
    },
    on_load: function() {
      const start_time = performance.now();

      const handler = function(e) {
        const pos = e.detail.position;
        const correct = pos === oddball_position;
        const click_rt = performance.now() - start_time;

        document.removeEventListener('oddball-click', handler);

        // Disable further clicks
        for (let c = 0; c < 4; c++) {
          const el = document.getElementById('cell-' + c);
          el.style.pointerEvents = 'none';
          el.style.cursor = 'default';
        }

        // Green on correct cell
        document.getElementById('cell-' + oddball_position).classList.add('cell-correct');

        // Red on chosen cell if wrong
        if (!correct) {
          document.getElementById('cell-' + pos).classList.add('cell-incorrect');
        }

        // Feedback banner
        const banner = document.getElementById('feedback-banner');
        banner.classList.add(correct ? 'correct' : 'incorrect');
        banner.textContent = correct ? 'Correct!' : 'Incorrect';

        // Auto-advance after 1.2s
        setTimeout(function() {
          jsPsych.finishTrial({
            response_position: pos,
            correct: correct,
            rt: click_rt
          });
        }, 1200);
      };

      document.addEventListener('oddball-click', handler);
    }
  });
});

// End screen
timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <div style="text-align:center;">
      <h2>Task Complete</h2>
      <p>Thank you! Your data has been saved as <code>oddball_data.csv</code>.</p>
    </div>
  `,
  choices: ['Finish']
});

jsPsych.run(timeline);
</script>
</html>
