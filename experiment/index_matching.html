    img {
      -webkit-user-drag: none;
      user-select: none;
      pointer-events: auto;
    }
    /* Fixed-height trial container to prevent layout shift */
    .trial-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 340px;
    }
    .study-area { text-align: center; }
    .study-area img {
      width: 200px; height: 200px; display: block; margin: 0 auto;
      border-radius: 6px;
    }
    .match-row {
      display: flex; flex-direction: row; gap: 20px;
      justify-content: center; align-items: center;
    }
    .match-cell {
      cursor: pointer; border: 4px solid transparent;
      border-radius: 6px; transition: border-color 0.15s;
    }
    .match-cell:hover { border-color: #666; }
    .match-cell img { width: 200px; height: 200px; display: block; }
    .match-cell.cell-correct { border-color: #1b5e20 !important; }
    .match-cell.cell-incorrect { border-color: #b71c1c !important; }
    .trial-prompt { text-align: center; font-size: 18px; margin-bottom: 15px; color: #222; }
    .trial-counter { text-align: center; font-size: 14px; color: #666; margin-bottom: 8px; }
    .feedback-banner {
      text-align: center; font-size: 28px; font-weight: bold; margin-top: 20px;
      min-height: 40px;
    }
    .feedback-banner.correct { color: #1b5e20; }
    .feedback-banner.incorrect { color: #b71c1c; }
    .mask-canvas { display: block; margin: 0 auto; }
  </style>
</head>

  // ── Pilot v3 — shift 0.30 ──
  {id:85, cat:"flannel", img:"1057", diff:0.30, k:5, version:"chroma_boost_lum_eq",

function isAttentionCheck(t) {
  return ATTENTION_CHECK_IDS.some(ac => ac.id === t.id && ac.version === t.version);
}

// ── Preload ─────────────────────────────────────────────────────────────────
const all_images = [];
trial_list.forEach(t => {
  all_images.push(
    STIM_DIR + t.study_f,
    STIM_DIR + t.match_f,
    STIM_DIR + t.foil1_f,
    STIM_DIR + t.foil2_f
  );
});

// ── Pattern mask ────────────────────────────────────────────────────────────
// Grayscale mask matching the 3AFC layout (3 × 200x200 squares with 20px gaps)
function makeMaskHTML_3() {
  return `<div class="trial-container">
    <p class="trial-counter" style="visibility:hidden;">placeholder</p>
    <p class="trial-prompt" style="visibility:hidden;">placeholder</p>
    <div class="match-row">${
    [0,1,2].map(i =>
      `<div class="match-cell" style="cursor:default;">` +
      `<canvas class="mask-canvas" id="mask-${i}" width="200" height="200"></canvas></div>`
    ).join('')
    }</div>
    <div class="feedback-banner"></div>
  </div>`;
}
function drawMask(canvasId, blockSize) {
  const c = document.getElementById(canvasId);
  if (!c) return;
  const ctx = c.getContext('2d');
  for (let y = 0; y < c.height; y += blockSize) {
    for (let x = 0; x < c.width; x += blockSize) {
      const v = Math.floor(Math.random() * 256);
      ctx.fillStyle = `rgb(${v},${v},${v})`;
      ctx.fillRect(x, y, blockSize, blockSize);
    }
  }
}
function drawAllMasks(n, blockSize) {
  for (let i = 0; i < n; i++) drawMask('mask-' + i, blockSize);
}

// ── Shuffle ─────────────────────────────────────────────────────────────────
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ── Timeline ────────────────────────────────────────────────────────────────
const timeline = [];
const total_trials = trial_list.length;

timeline.push({
  type: jsPsychPreload,
  images: all_images,
  show_progress_bar: true,
  message: '<p>Loading stimuli...</p>'
});

timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <div style="max-width: 600px; margin: 0 auto; text-align: left;">
      <h2>Color Matching Task</h2>
      <p>On each trial you will first see a <strong>single color pattern image</strong>
      to study.</p>
      <p>After a brief pause, you will see <strong>three images</strong>.
      Your task: <strong>click the image whose colors best match</strong>
      the one you just studied.</p>
      <p>One image is the correct match, and two are foils with different
      color proportions.</p>
      <p>There are <strong>${total_trials} trials</strong>.</p>
    </div>
  `,
  choices: ['Begin']
});

const shuffled_trials = shuffle([...trial_list]);

shuffled_trials.forEach((t, trial_index) => {
  const trial_number = trial_index + 1;

  const study_src = STIM_DIR + t.study_f;
  const match_src = STIM_DIR + t.match_f;
  const foil1_src = STIM_DIR + t.foil1_f;
  const foil2_src = STIM_DIR + t.foil2_f;

  // ── Study phase (2s) ──────────────────────────────────────────────────
  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <div class="trial-container">
        <p class="trial-counter">Trial ${trial_number} of ${total_trials}</p>
        <p class="trial-prompt">Study this image.</p>
        <div class="study-area">
          <img src="${study_src}" alt="study stimulus">
        </div>
        <div class="feedback-banner"></div>
      </div>
    `,
    choices: 'NO_KEYS',
    trial_duration: 2000
  });

  // ── Mask (500ms) ──────────────────────────────────────────────────────
  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: makeMaskHTML_3(),
    choices: 'NO_KEYS',
    trial_duration: 500,
    on_load: function() { drawAllMasks(3, 10); }
  });

  // ── 3AFC ──────────────────────────────────────────────────────────────
  const options = [
    { src: match_src, type: 'match' },
    { src: foil1_src, type: 'foil' },
    { src: foil2_src, type: 'foil' },
  ];
  shuffle(options);
  const correct_position = options.findIndex(o => o.type === 'match');

  const row_html = `
    <div class="trial-container">
      <p class="trial-counter">Trial ${trial_number} of ${total_trials}</p>
      <p class="trial-prompt">Click the image that matches what you just studied.</p>
      <div class="match-row">
        ${options.map((opt, i) => `
          <div class="match-cell" id="cell-${i}"
               onclick="document.dispatchEvent(new CustomEvent('match-click',{detail:{position:${i}}}))">
            <img src="${opt.src}" alt="option">
          </div>
        `).join('')}
      </div>
      <div class="feedback-banner" id="feedback-banner"></div>
    </div>
  `;

  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: row_html,
    choices: 'NO_KEYS',
    trial_duration: null,
    data: {
      task: 'matching',
      trial_id: t.id,
      trial_number: trial_number,
      category: t.cat,
      image_id: t.img,
      difficulty: t.diff,
      n_colors: t.k,
      correct_position: correct_position,
      version: t.version,
      attention_check: isAttentionCheck(t),
      option_types: options.map(o => o.type).join(',')
    },
    on_load: function() {
      const start_time = performance.now();
      const handler = function(e) {
        const pos = e.detail.position;
        const correct = pos === correct_position;
        const click_rt = performance.now() - start_time;
        document.removeEventListener('match-click', handler);

        for (let c = 0; c < 3; c++) {
          const el = document.getElementById('cell-' + c);
          el.style.pointerEvents = 'none';
          el.style.cursor = 'default';
        }
        document.getElementById('cell-' + correct_position).classList.add('cell-correct');
        if (!correct) {
          document.getElementById('cell-' + pos).classList.add('cell-incorrect');
        }
        const banner = document.getElementById('feedback-banner');
        banner.classList.add(correct ? 'correct' : 'incorrect');
        banner.textContent = correct ? 'Correct!' : 'Incorrect';

        setTimeout(function() {
          jsPsych.finishTrial({
            response_position: pos,
            response_type: options[pos].type,
            correct: correct,
            rt: click_rt
          });
        }, 1200);
      };
      document.addEventListener('match-click', handler);
    }
  });
});

timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <div style="text-align:center;">
      <h2>Task Complete</h2>
      <p>Thank you! Your data has been saved as <code>matching_data.csv</code>.</p>
    </div>
  `,
  choices: ['Finish']
});

jsPsych.run(timeline);
</script>
