<!DOCTYPE html>
<html>
<head>
  <title>Matching Task Pilot — Rate Match Variants</title>
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css">
  <style>
    .pilot-row {
      display: flex;
      flex-direction: row;
      gap: 16px;
      justify-content: center;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .pilot-cell {
      text-align: center;
    }
    .pilot-cell img {
      width: 200px;
      height: 200px;
      display: block;
      border: 3px solid transparent;
      border-radius: 6px;
    }
    .pilot-cell .label {
      font-size: 13px;
      font-weight: bold;
      margin-top: 4px;
      color: #555;
    }
    .study-img {
      border-color: #1565c0 !important;
    }
    .foil-img {
      border-color: #888 !important;
    }
    .match-img {
      border-color: #2e7d32 !important;
    }
    .section-label {
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      margin: 16px 0 8px 0;
      color: #333;
    }
    .trial-header {
      text-align: center;
      font-size: 14px;
      color: #888;
      margin-bottom: 4px;
    }
    .trial-prompt {
      text-align: center;
      font-size: 18px;
      margin-bottom: 12px;
    }
    .version-section {
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .version-label {
      font-size: 15px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 8px;
    }
    .response-area {
      max-width: 700px;
      margin: 20px auto 0 auto;
    }
    .response-area textarea {
      width: 100%;
      height: 80px;
      font-size: 14px;
      padding: 8px;
      border: 1px solid #aaa;
      border-radius: 4px;
      resize: vertical;
    }
    .response-area label {
      display: block;
      font-size: 15px;
      margin-bottom: 6px;
    }
    .submit-btn {
      display: block;
      margin: 12px auto;
      padding: 10px 30px;
      font-size: 16px;
      cursor: pointer;
      background: #1565c0;
      color: white;
      border: none;
      border-radius: 4px;
    }
    .submit-btn:hover {
      background: #0d47a1;
    }
    .mask-canvas {
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body></body>
<script>
const jsPsych = initJsPsych({
  on_finish: function() {
    jsPsych.data.get().filter({task: 'matching_pilot'}).localSave('csv', 'matching_pilot_data.csv');
  }
});

const STIM_DIR = '../bitmap_trials/jspsych_stimuli/';

// ── Matching trials (54 trials) ────────────────────────────────────────────
const trial_list = [
  {id:1, cat:"brick", img:"0291", diff:0.30, k:5, version:"chroma_boost_lum_eq"},
  {id:3, cat:"fleece", img:"1064", diff:0.30, k:5, version:"chroma_boost_lum_eq"},
  {id:5, cat:"emerald", img:"0938", diff:0.30, k:4, version:"original"},
  {id:6, cat:"cellophane", img:"0454", diff:0.30, k:4, version:"chroma_boost_lum_eq"},
  {id:13, cat:"quartzite", img:"2383", diff:0.25, k:5, version:"chroma_boost_lum_eq"},
  {id:14, cat:"moss", img:"1832", diff:0.25, k:5, version:"original"},
  {id:15, cat:"sandstone", img:"2606", diff:0.25, k:5, version:"original"},
  {id:16, cat:"lava", img:"1601", diff:0.25, k:5, version:"original"},
  {id:18, cat:"brownstone", img:"0330", diff:0.25, k:4, version:"original"},
  {id:19, cat:"terracotta", img:"3119", diff:0.25, k:4, version:"original"},
  {id:20, cat:"oilpaper", img:"1955", diff:0.25, k:4, version:"original"},
  {id:23, cat:"resin", img:"2433", diff:0.25, k:3, version:"chroma_boost_lum_eq"},
  {id:24, cat:"bone", img:"0228", diff:0.25, k:3, version:"chroma_boost_lum_eq"},
  {id:25, cat:"satin", img:"2653", diff:0.20, k:5, version:"chroma_boost_lum_eq"},
  {id:28, cat:"leather", img:"1634", diff:0.25, k:5, version:"original"},
  {id:32, cat:"satinwood", img:"2674", diff:0.20, k:4, version:"chroma_boost_lum_eq"},
  {id:32, cat:"satinwood", img:"2674", diff:0.20, k:4, version:"lum_eq"},
  {id:34, cat:"shell", img:"2711", diff:0.20, k:3, version:"chroma_boost_lum_eq"},
  {id:34, cat:"shell", img:"2711", diff:0.20, k:3, version:"original"},
  {id:35, cat:"garnet", img:"1231", diff:0.20, k:3, version:"original"},
  {id:38, cat:"wool", img:"3452", diff:0.15, k:5, version:"chroma_boost_lum_eq"},
  {id:38, cat:"wool", img:"3452", diff:0.15, k:5, version:"original"},
  {id:39, cat:"play_dough", img:"2284", diff:0.15, k:5, version:"original"},
  {id:44, cat:"opal", img:"2008", diff:0.15, k:4, version:"original"},
  {id:45, cat:"sequin", img:"2693", diff:0.15, k:3, version:"original"},
  {id:46, cat:"flame", img:"1025", diff:0.15, k:3, version:"original"},
  {id:47, cat:"moonstone", img:"1802", diff:0.15, k:3, version:"lum_eq"},
  {id:48, cat:"coral", img:"0739", diff:0.15, k:3, version:"original"},
  {id:52, cat:"suede", img:"2973", diff:0.15, k:5, version:"chroma_boost_lum_eq"},
  {id:52, cat:"suede", img:"2973", diff:0.15, k:5, version:"lum_eq"},
  {id:54, cat:"fluorine", img:"1108", diff:0.15, k:4, version:"original"},
  {id:55, cat:"flint", img:"1090", diff:0.15, k:4, version:"original"},
  {id:57, cat:"ruby", img:"2514", diff:0.15, k:3, version:"original"},
  {id:58, cat:"paint", img:"2029", diff:0.15, k:3, version:"chroma_boost_lum_eq"},
  {id:58, cat:"paint", img:"2029", diff:0.15, k:3, version:"lum_eq"},
  {id:58, cat:"paint", img:"2029", diff:0.15, k:3, version:"original"},
  {id:61, cat:"paint", img:"2023", diff:0.30, k:5, version:"lum_eq"},
  {id:63, cat:"paint", img:"2027", diff:0.20, k:3, version:"original"},
  {id:65, cat:"paint", img:"2033", diff:0.15, k:4, version:"chroma_boost_lum_eq"},
  {id:65, cat:"paint", img:"2033", diff:0.15, k:4, version:"original"},
  {id:67, cat:"paint", img:"2039", diff:0.25, k:5, version:"original"},
  {id:68, cat:"paint", img:"2042", diff:0.20, k:4, version:"original"},
  {id:70, cat:"play_dough", img:"2271", diff:0.25, k:4, version:"chroma_boost_lum_eq"},
  {id:70, cat:"play_dough", img:"2271", diff:0.25, k:4, version:"lum_eq"},
  {id:71, cat:"play_dough", img:"2273", diff:0.20, k:3, version:"chroma_boost_lum_eq"},
  {id:74, cat:"play_dough", img:"2279", diff:0.30, k:3, version:"original"},
  {id:79, cat:"soap", img:"2883", diff:0.20, k:4, version:"chroma_boost_lum_eq"},
  {id:79, cat:"soap", img:"2883", diff:0.20, k:4, version:"original"},
  {id:81, cat:"algae", img:"0001", diff:0.25, k:5, version:"original"},
  {id:82, cat:"crepe_paper", img:"0841", diff:0.20, k:4, version:"lum_eq"},
  {id:83, cat:"crepe_paper", img:"0838", diff:0.25, k:5, version:"chroma_boost_lum_eq"},
  {id:84, cat:"foliage", img:"1149", diff:0.20, k:4, version:"original"},
  {id:85, cat:"flannel", img:"1057", diff:0.15, k:5, version:"chroma_boost_lum_eq"},
  {id:85, cat:"flannel", img:"1057", diff:0.15, k:5, version:"original"},
];

// ── Build paths ─────────────────────────────────────────────────────────────
function trialPaths(t) {
  const tid = String(t.id).padStart(2, '0');
  return {
    oddball:    `${STIM_DIR}t${tid}_part1_oddball_${t.version}.png`,
    distractor2: `${STIM_DIR}t${tid}_part2_distractor_${t.version}.png`,
    distractor3: `${STIM_DIR}t${tid}_part3_distractor_${t.version}.png`,
    match_v1:   `${STIM_DIR}t${tid}_match_v1_${t.version}.png`,
    match_v2:   `${STIM_DIR}t${tid}_match_v2_${t.version}.png`,
    match_v3:   `${STIM_DIR}t${tid}_match_v3_${t.version}.png`,
  };
}

// ── Preload ─────────────────────────────────────────────────────────────────
const all_images = [];
trial_list.forEach(t => {
  const p = trialPaths(t);
  all_images.push(p.oddball, p.distractor2, p.distractor3,
                  p.match_v1, p.match_v2, p.match_v3);
});

// ── Pattern mask ────────────────────────────────────────────────────────────
function makeMaskHTML(w, h) {
  return `<canvas class="mask-canvas" id="mask-canvas" width="${w}" height="${h}"></canvas>`;
}
function drawMask(canvasId, blockSize) {
  const c = document.getElementById(canvasId);
  if (!c) return;
  const ctx = c.getContext('2d');
  for (let y = 0; y < c.height; y += blockSize) {
    for (let x = 0; x < c.width; x += blockSize) {
      ctx.fillStyle = `rgb(${Math.floor(Math.random()*256)},${Math.floor(Math.random()*256)},${Math.floor(Math.random()*256)})`;
      ctx.fillRect(x, y, blockSize, blockSize);
    }
  }
}

// ── Timeline ────────────────────────────────────────────────────────────────
const timeline = [];
const total_trials = trial_list.length;

timeline.push({
  type: jsPsychPreload,
  images: all_images,
  show_progress_bar: true,
  message: '<p>Loading stimuli...</p>'
});

timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <div style="max-width:650px; margin:0 auto; text-align:left;">
      <h2>Matching Task Pilot</h2>
      <p>On each trial you will see:</p>
      <ul>
        <li>The <strong>oddball</strong> image (blue border) — what the participant would study</li>
        <li>Two <strong>distractor foils</strong> (grey borders) — same-trial distractors</li>
        <li>Three <strong>match candidates</strong> (green borders, labeled A/B/C) — each has
            the same color proportions as the oddball but a different spatial arrangement</li>
      </ul>
      <p>For each trial, rate the 3 match candidates. Which look like plausible
      matches to the oddball? Which are too easy or too hard to distinguish from
      the distractors? Use the free-response box to explain.</p>
      <p>There are <strong>${total_trials} trials</strong>.</p>
    </div>
  `,
  choices: ['Begin']
});

trial_list.forEach((t, trial_index) => {
  const trial_number = trial_index + 1;
  const p = trialPaths(t);

  const display_html = `
    <p class="trial-header">Trial ${trial_number} of ${total_trials} —
      t${String(t.id).padStart(2,'0')} / ${t.cat} / ${t.version}
      (k=${t.k}, diff=${t.diff})</p>

    <div class="section-label">Study target (oddball)</div>
    <div class="pilot-row">
      <div class="pilot-cell">
        <img src="${p.oddball}" class="study-img" alt="oddball">
        <div class="label">Oddball</div>
      </div>
    </div>

    <div class="section-label">Distractor foils (same trial)</div>
    <div class="pilot-row">
      <div class="pilot-cell">
        <img src="${p.distractor2}" class="foil-img" alt="distractor">
        <div class="label">Distractor</div>
      </div>
      <div class="pilot-cell">
        <img src="${p.distractor3}" class="foil-img" alt="distractor">
        <div class="label">Distractor</div>
      </div>
    </div>

    <div class="section-label">Match candidates (same oddball proportions, new layout)</div>
    <div class="pilot-row">
      <div class="pilot-cell">
        <img src="${p.match_v1}" class="match-img" alt="match v1">
        <div class="label">A</div>
      </div>
      <div class="pilot-cell">
        <img src="${p.match_v2}" class="match-img" alt="match v2">
        <div class="label">B</div>
      </div>
      <div class="pilot-cell">
        <img src="${p.match_v3}" class="match-img" alt="match v3">
        <div class="label">C</div>
      </div>
    </div>

    <div class="response-area">
      <label>Which match(es) work well? Any issues? (e.g., "A looks good, C too similar to distractors")</label>
      <textarea id="pilot-response" placeholder="Type your evaluation here..."></textarea>
      <button class="submit-btn" id="submit-btn">Next Trial</button>
    </div>
  `;

  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: display_html,
    choices: 'NO_KEYS',
    trial_duration: null,
    data: {
      task: 'matching_pilot',
      trial_id: t.id,
      trial_number: trial_number,
      category: t.cat,
      image_id: t.img,
      difficulty: t.diff,
      n_colors: t.k,
      version: t.version,
    },
    on_load: function() {
      document.getElementById('submit-btn').addEventListener('click', function() {
        const response = document.getElementById('pilot-response').value;
        jsPsych.finishTrial({ free_response: response });
      });
    }
  });
});

// End screen
timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <div style="text-align:center;">
      <h2>Pilot Complete</h2>
      <p>Thank you! Data saved as <code>matching_pilot_data.csv</code>.</p>
    </div>
  `,
  choices: ['Finish']
});

jsPsych.run(timeline);
</script>
</html>
